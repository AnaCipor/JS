<!-- Техническое задание 

На основе приложения, созданного на занятии, добавить пользовательский веб-интерфейс. 
1. Создать страницу index.html 
На странице должны находиться: 
поле для ввода имени пользователя; 
поле для ввода названия блюда; 
кнопка «Искать»; 
область для вывода результата работы приложения. 


2. Определение пользователя 
Пользователь вводит своё имя. 
После получения имени программа должна проверить, существует ли такой пользователь в приложении. 
Если пользователь найден, необходимо использовать его существующую роль. 
Например: 
John → USER 
Bill → ADMIN 
Если пользователь с таким именем не найден, необходимо считать его новым пользователем и присвоить ему роль: 
GUEST 
То есть логика должна быть примерно такой: 
введено имя 

     ↓ 

ищем пользователя 

     ↓ 

┌───────────────┬─────────────────┐ 

│ найден        │ не найден       │ 

↓               ↓ 

его роль        роль GUEST 

 

3. Ввод названия блюда 

Пользователь должен иметь возможность с клавиатуры ввести название блюда, которое он хочет приготовить. 

Например: 
борщ 
или: 
плов 
или:
омлет 

Название блюда не должно быть жёстко записано в JavaScript-коде. 
То есть вместо: 
const dishTitle = "борщ"; 
значение должно быть получено из HTML-формы. 

 
4. Кнопка «Искать» 
После нажатия кнопки «Искать» приложение должно.: 
получить имя пользователя из HTML; 
определить пользователя и его роль; 
получить название блюда; 
Передать это все в уже написанный код 
Вывести результат на экран 

5. Вывод результата 
Ответ AI необходимо вывести непосредственно на страницу. 
Например: 
Результат: 


Свекла 
Картофель 
Лук 
Говядина 
Для вывода результата необходимо изменить содержимое HTML при помощи JavaScript. 
Не ограничиваться: 
console.log(...) 
Результат должен увидеть пользователь страницы. 


6. Обработка ошибок 
Если во время работы приложения возникает ошибка, она не должна приводить просто к сообщению в консоли. 
Например: 
не удалось получить ответ AI
неверные данные 
не указан пользователь 
не указано название блюда 
другая ошибка приложения 

В этом случае пользователю необходимо показать модальное окно с сообщением об ошибке. 
Схема: 
try 
 ↓ 
работа приложения 
 ↓ 
успех 
 ↓ 
результат на странице 

catch 
 ↓ 
модальное окно 
 ↓ 
текст ошибки 

Ожидаемый сценарий работы 
Пользователь открывает страницу. 
Например, вводит: 
Имя: 
Bill 

Блюдо: 
борщ 

Нажимает: 
Искать 

Программа определяет: 
Bill → ADMIN 
формирует соответствующий запрос к AI и выводит на страницу продукты, которые необходимо докупить. 


Другой пример: 
Имя: 
John 

Блюдо: 
борщ 
Программа определяет: 
John → USER 
и выводит продукты из холодильника, которые можно использовать для приготовления блюда. 

Если введено: 
Имя: 
Anna 
а такого пользователя в системе нет: 
Anna → GUEST 
Приложение должно продолжить работу уже с ролью GUEST. 

Требование к структуре программы 
Не переносить всю JavaScript-логику в index.html. 
Использовать уже созданную многомодульную структуру приложения. 
HTML должен отвечать за интерфейс пользователя, а существующие модули — за свою бизнес-логику. 
В результате должна сохраниться примерно такая архитектура: 

index.html 
     ↓ 
main.js 
     │ 
     ├── authService.js 
     ├── fileService.js 
     ├── promptService.js 
     ├── aiService.js 
     └── config.js 

Главная задача — не переписать приложение заново, а подключить к уже существующей логике веб-интерфейс. 

***7. Проверка введённых данных УСЛОЖНЕННОЕ 
Перед выполнением поиска необходимо проверить пользовательский ввод. 
Если имя пользователя не введено: 
Введите имя пользователя 
Если название блюда не введено: 
Ввдите название блюда 
Ошибка должна быть показана пользователю через предусмотренный интерфейс обработки ошибок.  -->
